<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background subtle glow -->
  <rect width="800" height="500" rx="24" fill="#f8fafc" />
  
  <!-- Network Connection Lines -->
  <path d="M400 240 L200 390 M400 240 L400 390 M400 240 L600 390" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,6" />

  <!-- Main Central Cloud -->
  <g filter="url(#shadow)">
    <path d="M 320 270 
             A 60 60 0 0 1 290 170 
             A 80 80 0 0 1 430 130 
             A 75 75 0 0 1 520 200 
             A 65 65 0 0 1 490 270 
             Z" fill="url(#cloudGrad)" />
  </g>

  <!-- Cloud Computing Core Text / Icon inside Cloud -->
  <text x="400" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0369a1">CLOUD COMPUTING</text>
  <text x="400" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b">Shared Pool • On-Demand • Scalable</text>

  <!-- Device 1: Laptop (Client / Broad Network Access) -->
  <g transform="translate(130, 360)">
    <rect x="0" y="0" width="140" height="85" rx="8" fill="#1e293b" />
    <rect x="10" y="10" width="120" height="65" rx="4" fill="#38bdf8" opacity="0.85" />
    <polygon points="-15,85 155,85 145,96 -5,96" fill="#64748b" />
    <text x="70" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">End User Device</text>
  </g>

  <!-- Device 2: Server / Data Center (IaaS / Infrastructure) -->
  <g transform="translate(340, 350)">
    <rect x="0" y="0" width="120" height="100" rx="8" fill="#1e293b" />
    <!-- Server racks -->
    <rect x="12" y="14" width="96" height="20" rx="3" fill="#334155" />
    <circle cx="24" cy="24" r="3" fill="#22c55e" />
    <circle cx="34" cy="24" r="3" fill="#38bdf8" />

    <rect x="12" y="40" width="96" height="20" rx="3" fill="#334155" />
    <circle cx="24" cy="50" r="3" fill="#22c55e" />
    <circle cx="34" cy="50" r="3" fill="#38bdf8" />

    <rect x="12" y="66" width="96" height="20" rx="3" fill="#334155" />
    <circle cx="24" cy="76" r="3" fill="#22c55e" />
    <circle cx="34" cy="76" r="3" fill="#38bdf8" />
    <text x="60" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Cloud Infrastructure</text>
  </g>

  <!-- Device 3: Smartphone (Mobile Access) -->
  <g transform="translate(565, 360)">
    <rect x="0" y="0" width="70" height="100" rx="12" fill="#1e293b" />
    <rect x="6" y="8" width="58" height="84" rx="6" fill="#38bdf8" opacity="0.85" />
    <circle cx="35" cy="86" r="4" fill="#ffffff" />
    <text x="35" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Mobile Platform</text>
  </g>

  <!-- Floating Feature Tags -->
  <g transform="translate(140, 110)">
    <rect width="110" height="34" rx="17" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
    <text x="55" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0369a1">IaaS</text>
  </g>
  <g transform="translate(345, 55)">
    <rect width="110" height="34" rx="17" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
    <text x="55" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0369a1">PaaS</text>
  </g>
  <g transform="translate(550, 110)">
    <rect width="110" height="34" rx="17" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
    <text x="55" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0369a1">SaaS</text>
  </g>
</svg>

